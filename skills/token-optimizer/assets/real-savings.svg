<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="title desc">
  <title id="title">30-day savings report: one real month with Token Optimizer</title>
  <desc id="desc">About $1,396 in API-equivalent value and 59.6M tokens never sent to the model over 30 days, roughly 28% of the workload. Three tiers: $126 logged actions (metered), $1,124 repeat reads avoided (estimated), $146 other estimates (estimated). Tokens: 150.8M spent, 25.4M saved metered, 34.2M saved estimated.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#0f0f11"/>
    </linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(135)">
      <rect width="7" height="7" fill="#2c1812"/>
      <rect width="3" height="7" fill="#e85329"/>
    </pattern>
    <style>
      .sans { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }
      .ink { fill: #f4f4f5; }
      .soft { fill: #c0c0c4; }
      .muted { fill: #8a8a8f; }
      .accent { fill: #e85329; }
      .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; fill: #8a8a8f; font-weight: 500; }
      .rise { animation: rise 900ms cubic-bezier(.2,.9,.2,1) both; }
      .d1 { animation-delay: 120ms; } .d2 { animation-delay: 260ms; } .d3 { animation-delay: 400ms; }
      .d4 { animation-delay: 540ms; } .d5 { animation-delay: 680ms; } .d6 { animation-delay: 820ms; }
      .grow { transform-box: fill-box; transform-origin: left center; animation: grow 1100ms cubic-bezier(.16,1,.3,1) both; }
      .g1 { animation-delay: 700ms; } .g2 { animation-delay: 820ms; } .g3 { animation-delay: 940ms; } .g4 { animation-delay: 1060ms; }
      @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) { .rise, .grow { animation: none; opacity: 1; transform: none; } }
    </style>
  </defs>

  <rect width="1000" height="760" rx="24" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="759" rx="24" fill="none" stroke="#27272a"/>

  <!-- header -->
  <g class="rise sans">
    <text x="60" y="66" class="eyebrow">Token Optimizer · one real month</text>
    <text x="60" y="112" class="ink" font-size="40" font-weight="600" letter-spacing="-0.02em">30-Day Savings Report</text>
    <text x="60" y="144" class="soft" font-size="17">1,698 sessions · all six levers on · about 28% of the workload never sent to the model</text>
  </g>

  <!-- two headline numbers -->
  <g class="rise d1">
    <text x="60" y="238" class="mono accent" font-size="72" font-weight="600" letter-spacing="-0.02em">$1,396</text>
    <text x="60" y="270" class="sans soft" font-size="17">API-equivalent value, 30 days · approximate</text>
  </g>
  <line x1="500" y1="180" x2="500" y2="290" stroke="#27272a" stroke-width="1"/>
  <g class="rise d2">
    <text x="540" y="238" class="mono ink" font-size="72" font-weight="600" letter-spacing="-0.02em">59.6M</text>
    <text x="540" y="270" class="sans soft" font-size="17">tokens never sent to the model</text>
  </g>

  <!-- three tiers -->
  <g class="rise d3 sans">
    <text x="60" y="336" class="eyebrow">In dollars, by how each tier is known</text>
  </g>
  <!-- tier 1: logged actions, metered  (126 / 1396 = 9.0%) -->
  <g class="rise d3">
    <text x="60" y="380" class="sans ink" font-size="17" font-weight="600">Logged actions</text>
    <text x="230" y="380" class="mono" font-size="11" fill="#e85329" letter-spacing=".06em">METERED</text>
    <text x="940" y="380" class="mono ink" font-size="22" font-weight="600" text-anchor="end">$126</text>
    <rect x="60" y="392" width="880" height="12" rx="3" fill="#27272a"/>
    <rect class="grow g1" x="60" y="392" width="79" height="12" rx="3" fill="#e85329"/>
  </g>
  <!-- tier 2: repeat reads avoided, estimated (1124 / 1396 = 80.5%) -->
  <g class="rise d4">
    <text x="60" y="450" class="sans ink" font-size="17" font-weight="600">Repeat reads avoided</text>
    <text x="270" y="450" class="mono" font-size="11" fill="#8a8a8f" letter-spacing=".06em">ESTIMATED</text>
    <text x="940" y="450" class="mono ink" font-size="22" font-weight="600" text-anchor="end">$1,124</text>
    <rect x="60" y="462" width="880" height="12" rx="3" fill="#27272a"/>
    <rect class="grow g2" x="60" y="462" width="708" height="12" rx="3" fill="url(#hatch)"/>
  </g>
  <!-- tier 3: other estimates (146 / 1396 = 10.5%) -->
  <g class="rise d5">
    <text x="60" y="520" class="sans ink" font-size="17" font-weight="600">Other estimates</text>
    <text x="230" y="520" class="mono" font-size="11" fill="#8a8a8f" letter-spacing=".06em">ESTIMATED</text>
    <text x="940" y="520" class="mono ink" font-size="22" font-weight="600" text-anchor="end">$146</text>
    <rect x="60" y="532" width="880" height="12" rx="3" fill="#27272a"/>
    <rect class="grow g3" x="60" y="532" width="92" height="12" rx="3" fill="url(#hatch)"/>
  </g>

  <!-- tokens bar: 150.8M spent (71.7%), 25.4M metered (12.1%), 34.2M estimated (16.2%) -->
  <g class="rise d6">
    <text x="60" y="604" class="sans eyebrow">The same month in tokens</text>
    <g class="grow g4">
      <rect x="60" y="618" width="629" height="16" rx="3" fill="#3f3f46"/>
      <rect x="692" y="618" width="105" height="16" rx="3" fill="#e85329"/>
      <rect x="800" y="618" width="140" height="16" rx="3" fill="url(#hatch)"/>
    </g>
    <g class="sans" font-size="15">
      <rect x="60" y="652" width="12" height="12" rx="2" fill="#3f3f46"/>
      <text x="80" y="663" class="soft"><tspan class="mono ink" font-weight="600">150.8M</tspan> spent</text>
      <rect x="290" y="652" width="12" height="12" rx="2" fill="#e85329"/>
      <text x="310" y="663" class="soft"><tspan class="mono ink" font-weight="600">25.4M</tspan> saved, metered</text>
      <rect x="560" y="652" width="12" height="12" rx="2" fill="url(#hatch)"/>
      <text x="580" y="663" class="soft"><tspan class="mono ink" font-weight="600">34.2M</tspan> saved, estimated</text>
    </g>
  </g>

  <!-- footnote -->
  <g class="rise d6 sans">
    <text x="60" y="712" class="muted" font-size="13">Metered: logged as it happened. Estimated: modelled from what happened, capped at each session's real compaction, shown separately.</text>
    <text x="60" y="734" class="muted" font-size="13">One person's last 30 days, snapshot 2026-09-14. Your dashboard computes the same report from your own sessions; your number will differ.</text>
  </g>
</svg>
